spring.application.name=TaskTracking
server.port=8081
spring.datasource.url=${DB_URL:jdbc:h2:mem:tasktracking;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deployment-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
